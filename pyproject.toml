[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ataad-pop"
version = "0.1.0"
description = "Transportability-aware Phenotype–Observation–Practice modeling for ATAAD operative decisions"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Wen Xie"},
  {name = "Hailong Qiu"},
  {name = "Changjiang Yu"},
  {name = "Tucheng Sun"},
  {name = "Xiaowei Xu"},
  {name = "Guang Tong"},
]
keywords = ["ATAAD", "transportability", "clinical prediction", "multiple imputation", "dataset shift"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
]

[project.optional-dependencies]
benchmark = ["lightgbm>=4.5"]
dev = ["pytest>=8.2", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
ataad-pop = "ataad_pop.cli:main"

[project.urls]
Repository = "https://github.com/vivalia/ataad-pop"
Issues = "https://github.com/vivalia/ataad-pop/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
